version: 2

project_name: qr

builds:
  - id: qr
    main: ./cmd/qr
    binary: qr
    env:
      # Fyne's window driver needs cgo.
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
